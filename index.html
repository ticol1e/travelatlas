@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1217;--sf:#171c23;--tx:#eef1f4;--mu:#98a2b0;--ln:#262d37;--ac:#2dd4bf;--acs:#12332f;--wi:#fbbf24;--g1:#22313e;--g2:#0f1821;--dot:#8a9ba8;--land:#33444f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1217;--sf:#171c23;--tx:#eef1f4;--mu:#98a2b0;--ln:#262d37;--ac:#2dd4bf;--acs:#12332f;--wi:#fbbf24;--g1:#22313e;--g2:#0f1821;--dot:#8a9ba8;--land:#33444f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
#app{display:grid;grid-template-columns:210px 1fr;min-height:100%}
nav{position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--ln);background:var(--sf);display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:18px;padding:4px 10px 16px;color:var(--ac)}
.nb{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--mu);font:inherit;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left}
.nb.on{background:var(--acs);color:var(--ac);font-weight:600}
main{padding:24px;max-width:1100px;width:100%}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px}
.btn{border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit;padding:8px 14px;border-radius:10px;cursor:pointer}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--sf);font-weight:600}.btn.on{background:var(--acs);color:var(--ac);border-color:var(--ac)}.btn.d{color:#dc2626}.btn.s{padding:4px 10px;font-size:13px;border-radius:99px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px 11px;width:100%}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.gl{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,1fr);gap:16px}
canvas{width:100%;aspect-ratio:1;touch-action:none;cursor:grab;display:block}
.list{max-height:400px;overflow:auto;margin-top:10px}
.ch{position:sticky;top:0;background:var(--sf);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);padding:8px 8px 4px;display:flex;justify-content:space-between}
.li{display:flex;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;align-items:center}.li:hover,.li.on{background:var(--acs)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.bar{height:6px;background:var(--ln);border-radius:9px;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:var(--ac)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--acs);color:var(--ac);font-size:13px;margin:2px 4px 2px 0}
.it{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}.it.done .t{text-decoration:line-through;color:var(--mu)}
.it a{color:var(--ac);font-weight:700;text-decoration:none}
.t{flex:1;min-width:0;overflow-wrap:anywhere}.cost{width:92px}
.add{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.add .a1{flex:2 1 160px}.add .a2{flex:2 1 140px}.add .a3{flex:0 0 90px}
.mu{color:var(--mu)}.x{border:0;background:none;color:var(--mu);cursor:pointer;font-size:17px;padding:0 4px}
.pt{cursor:pointer}.pt:hover{border-color:var(--ac)}
dialog{border:1px solid var(--ln);border-radius:16px;background:var(--sf);color:var(--tx);padding:20px;width:min(440px,92vw)}dialog::backdrop{background:#0008}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
@media(max-width:859px){#app{grid-template-columns:1fr}nav{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--ln);z-index:5}.brand{display:none}.nb{flex-direction:column;gap:2px;font-size:12px;padding:6px 18px;align-items:center}main{padding:16px 16px 96px}.gl{grid-template-columns:1fr}}

if(!em||pw.length<6){AE="Bitte E-Mail und Passwort (mind. 6 Zeichen) eingeben.";render();return}
const r=kind==="signup"?await db.auth.signUp({email:em,password:pw,options:{data:{name:nm}}}):await db.auth.signInWithPassword({email:em,password:pw});
if(r.error){AE=r.error.message;render();return}
if(!r.data.session){AE="Fast geschafft: Bitte bestätige die E-Mail in deinem Posteingang und melde dich dann an.";render();return}
await setCK(pw,r.data.session.user.id);await onSession(r.data.session)}
async function authOut(){let ok=1;try{await pushState()}catch(e){ok=0}if(CK&&ok){S={visited:{},wish:{},trips:[],codes:{}};CE="";CK=null;try{localStorage.removeItem("reiseatlas");localStorage.removeItem("reise_ck")}catch(e){}}await db.auth.signOut();if(ch){db.removeChannel(ch);ch=null}me=null;G={groups:[],trips:[],raw:[]};KC={};dbs="login";render()}
async function onSession(s){me=s.user.id;dbs="wait";const nm=(s.user.user_metadata&&s.user.user_metadata.name)||(s.user.email||"").split("@")[0];
db.from("profiles").upsert({id:me,name:nm}).then(()=>{});
try{const r=await db.from("user_state").select("state").eq("user_id",me).maybeSingle();if(r.data&&r.data.state){const d=r.data.state;S.visited=d.visited||{};S.wish=d.wish||{};S.trips=d.trips||[];CE=d.codes_enc||"";await loadCK(me);if(CK&&CE){try{S.codes={...(await unseal(CK,CE)),...S.codes}}catch(e){}}}else savePriv(1);if(CK)savePriv(1)}catch(e){}
subscribe();await loadShared();render()}
function vGroups(){const can=!!me;let h=`<div class="row sp"><div><h1>Gruppen</h1><p class="sub">Beitritt nur mit Einladungscode – Reisedaten sind mit dem Code verschlüsselt.</p></div>${can&&CR?'<button class="btn p" data-a="newgroup">+ Neue Gruppe</button>':""}</div>`;
if(!can)return h+accCard();
if(!CR)h+='<p class="mu">Verschlüsselung ist in diesem Browser nicht verfügbar – Gruppen sind deaktiviert.</p>';
if(AE)h+=`<p style="color:#dc2626">${esc(AE)}</p>`;if(dbs==="off")h+=`<p style="color:#dc2626">Gruppen konnten nicht geladen werden${LE?": "+esc(LE):""}. Wurde setup.sql in Supabase ausgeführt?</p>`;else if(dbs!=="ok")h+=`<p class="mu">Lade Gruppen …</p>`;
h+=G.groups.length?`<div class="grid">${G.groups.map(g=>{const un=!!KC[g.id],ts=G.trips.filter(t=>t.group===g.id),n=(g.members||[]).length,cd=esc(S.codes[g.id]||"");
return `<div class="card"><div class="row sp"><b style="font-size:17px">${un?"👥":"🔒"} ${esc(g.name)}</b>${un&&g.owner===me?`<button class="x" data-a="delgroup" data-i="${g.id}" title="Gruppe löschen">${armed===g.id?"Wirklich?":"🗑"}</button>`:""}</div>`+(un?`<div style="margin:8px 0">${(g.members||[]).map(i=>`<span class="chip">${esc(i===me?(NM[i]||"Du")+" (du)":NM[i]||"Mitglied")}</span>`).join("")}</div><div class="row" style="margin:6px 0"><span class="mu">Einladungscode</span><b style="font-family:ui-monospace,monospace;letter-spacing:.08em;user-select:all">${cd}</b><button class="btn s" data-a="copy" data-v="${cd}">Kopieren</button></div><div class="mu">${ts.length?ts.map(t=>`<div class="li" data-a="open" data-i="${t.id}">${fl(t.cc)} <span class="t">${esc(t.name)}</span></div>`).join(""):"Noch keine gemeinsame Reise."}</div><div class="row" style="margin-top:10px"><button class="btn p" data-a="newtrip" data-i="${g.id}">Reise planen</button><button class="btn" data-a="leave" data-i="${g.id}">Verlassen</button></div>`:`<p class="mu" style="margin:8px 0">Inhalt gesperrt</p><div class="row" style="flex-wrap:nowrap"><input id="jc_${g.id}" data-enter="join" data-i="${g.id}" placeholder="Einladungscode" autocomplete="off"><button class="btn p" data-a="join" data-i="${g.id}">Beitreten</button></div>${JE[g.id]?'<p style="color:#dc2626;margin:6px 0 0">Code stimmt nicht.</p>':""}`)+`</div>`}).join("")}</div>`:'<div class="card mu">Noch keine Gruppe. Lege eine an und gib den Einladungscode an deine Mitreisenden weiter.</div>';return h+'<p style="margin-top:16px"><button class="btn s" data-a="logout">Abmelden</button></p>'}
function dGroup(){const d=$("#dlg");d.innerHTML=`<b style="font-size:18px">Neue Gruppe</b><label>Gruppenname</label><input id="g_n" placeholder="z. B. Familie, WG, Interrail-Crew"><div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" data-a="close">Abbrechen</button><button class="btn p" data-a="savegroup">Erstellen</button></div>`;d.showModal()}
/* ---------- Steuerung ---------- */
function render(){nav();$("#main").innerHTML=view==="globe"?vGlobe():view==="trips"?vTrips():vGroups();cv=null;if(view==="globe"){bindGlobe();stats();renderSel();renderList();$("#q").oninput=e=>{q=e.target.value;renderList()}}else if(view==="trips"&&$("#tq"))$("#tq").oninput=e=>{tq=e.target.value;$("#tgrid").innerHTML=tripCards()}}
function soft(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$("#main").contains(a)){dirty=1;return}render()}
document.addEventListener("focusout",()=>{if(dirty)setTimeout(()=>{const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){dirty=0;render()}},60)});
function addItem(e){const r=e.closest(".add"),f=k=>r.querySelector(`[data-f=${k}]`).value.trim(),v=f("t");if(!v)return;const t=T();t.items.push({id:uid(),cat:r.dataset.c,t:v,d:0,cost:+f("p")||0,url:safeUrl(f("u"))});commit(t);render()}
function addCat(e){const v=e.value.trim(),t=T();if(v&&!t.cats.includes(v)){t.cats.push(v);commit(t);render()}}
function tog(m,k){const o=m===S.visited?S.wish:S.visited;if(m[k])delete m[k];else{m[k]=1;delete o[k]}savePriv();stats();renderSel();renderList()}

document.addEventListener("click",ev=>{const e=ev.target.closest("[data-a]");if(!e)return;const a=e.dataset.a,i=e.dataset.i;
if(["chk","cost","notes","url"].includes(a))return;if(a!=="deltrip"&&a!=="delgroup")armed=null;
if(a==="v"){view=e.dataset.v;if(view!=="trips")openTrip=null;render()}
else if(a==="cf"){fc=e.dataset.c;renderList()}
else if(a==="pick"){sel=e.dataset.c;target={lo:byC[sel].lo,la:byC[sel].la,zm:Math.min(8,Math.max(1,45/Math.max(byC[sel].ext,.5)))};renderSel();renderList()}
else if(a==="zin"){ZM=Math.min(10,ZM*1.6);target=null}else if(a==="zout"){ZM=Math.max(1,ZM/1.6);target=null}else if(a==="zrst"){ZM=1;target=null}
else if(a==="vis")tog(S.visited,sel);else if(a==="wish")tog(S.wish,sel);
else if(a==="plan")dTrip(sel);else if(a==="newtrip")dTrip(null,i);else if(a==="close")$("#dlg").close();
else if(a==="savetrip"){const c=$("#f_c").value,t={id:uid(),name:$("#f_n").value.trim()||byC[c].n,cc:c,start:$("#f_s").value,end:$("#f_e").value,group:$("#f_g").value,budget:+$("#f_b").value||0,notes:"",cats:Object.keys(TPL),items:[]};Object.entries(TPL).forEach(([k,l])=>l.forEach(x=>t.items.push({id:uid(),cat:k,t:x,d:0,cost:0,url:""})));if(t.group)G.trips.push(t);else S.trips.unshift(t);commit(t);openTrip=t.id;view="trips";$("#dlg").close();render()}
else if(a==="open"){view="trips";openTrip=i;render()}
else if(a==="back"){openTrip=null;render()}
else if(a==="deltrip"){const t=T();if(armed===t.id){if(t.group){G.trips=G.trips.filter(x=>x.id!==t.id);if(db)db.from("trips").delete().eq("id",t.id).then(()=>{})}else{S.trips=S.trips.filter(x=>x.id!==t.id);savePriv()}openTrip=null;armed=null}else armed=t.id;render()}
else if(a==="di"){const t=T();t.items=t.items.filter(x=>x.id!==i);commit(t);render()}
else if(a==="lnk"){editId=editId===i?null:i;render()}
else if(a==="additem")addItem(e);else if(a==="addcat")addCat(e.previousElementSibling);
else if(a==="dcat"){const t=T(),c=e.dataset.c;t.cats=t.cats.filter(x=>x!==c);t.items=t.items.filter(x=>x.cat!==c);commit(t);render()}
else if(a==="copy"){try{navigator.clipboard.writeText(e.dataset.v)}catch(x){}}
else if(a==="login"||a==="signup")authGo(a);else if(a==="logout")authOut();else if(a==="savecfg")saveCfg();
else if(a==="newgroup")dGroup();
else if(a==="savegroup")mkGroup();
else if(a==="join")joinGroup(i,$("#jc_"+i).value);else if(a==="leave")leaveG(i);
else if(a==="delgroup"){if(armed===i){G.groups=G.groups.filter(g=>g.id!==i);G.trips=G.trips.filter(t=>t.group!==i);db.from("groups").delete().eq("id",i).then(()=>loadShared());delete KC[i];delete S.codes[i];savePriv();armed=null}else armed=i;render()}});
document.addEventListener("change",ev=>{const e=ev.target,a=e.dataset.a;if(!a)return;const t=T(),it=t&&t.items.find(x=>x.id===e.dataset.i);
if(a==="chk"){it.d=e.checked?1:0;commit(t);render()}
else if(a==="cost"){it.cost=+e.value||0;commit(t);render()}
else if(a==="url"){it.url=safeUrl(e.value);editId=null;commit(t);render()}
else if(a==="notes"){t.notes=e.value;commit(t)}});
document.addEventListener("keydown",ev=>{if(ev.key!=="Enter")return;const e=ev.target,k=e.dataset&&e.dataset.enter;if(k==="additem")addItem(e);else if(k==="addcat")addCat(e);else if(k==="join")joinGroup(e.dataset.i,e.value)});
async function resolveNames(){const ids=[...new Set(G.groups.flatMap(g=>g.members||[]))].filter(i=>!(i in NM));if(!ids.length)return;const r=await db.from("profiles").select("id,name").in("id",ids);(r.data||[]).forEach(p=>NM[p.id]=p.name||"");ids.forEach(i=>{if(!(i in NM))NM[i]=""});soft()}
async function init(){render();frame();if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
try{const c=JSON.parse(localStorage.getItem("reise_cfg")||"{}");if(c.url)CFG=c}catch(e){}
const W=window.REISE_CFG;if(W&&W.url&&W.key&&!/HIER-/.test(W.key))CFG={url:W.url,key:W.key};
if(!CFG.url||!CFG.key||!window.supabase){dbs="nocfg";return}
db=window.supabase.createClient(CFG.url,CFG.key);
try{const{data}=await db.auth.getSession();if(data.session)await onSession(data.session);else{dbs="login";soft()}}catch(e){dbs="off";soft()}}
init();
</script></body></html>
